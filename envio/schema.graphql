type Purchase {
  id: ID!
  permitId: String!
  datasetId: String!
  buyer: String!
  publisher: String!
  amount: BigInt!
  expiresAt: BigInt!
  quota: BigInt!
  txHash: String!
  timestamp: BigInt!
  revoked: Boolean!
}
type Withdrawal {
 id: ID!
 recipient: String!
 amount: BigInt!
 txHash: String!
 timestamp: BigInt!
}
